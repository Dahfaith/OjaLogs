<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ojaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0f265c" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="ojaCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="ojaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ojaBg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Outer Cyan Aperture Ring (Letter O) -->
  <circle cx="32" cy="32" r="18" stroke="url(#ojaCyan)" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#softGlow)" />

  <!-- Center Golden Fintech Sparkle -->
  <path d="M32 19 L34.8 29.2 L45 32 L34.8 34.8 L32 45 L29.2 34.8 L19 32 L29.2 29.2 Z" fill="url(#ojaGold)" />

  <!-- Center White Star Core -->
  <circle cx="32" cy="32" r="2.5" fill="#ffffff" />
</svg>

